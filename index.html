<style>/* src/glass/glass.css */
:root {
  color-scheme: light dark;
  --purple: #7c3aed;
  --purple-ink: #5b21b6;
  --danger-ink: #a3162c;
  --ink: #1f1238;
  --ink-soft: rgb(31 18 56 / 0.86);
  --lit-ink: #2e1065;
  --bg-base: #efe7fb;
  --glass-fill: rgb(255 255 255 / 0.38);
  --glass-fill-strong: rgb(255 255 255 / 0.56);
  --glass-rim: rgb(255 255 255 / 0.85);
  --glass-rim-dim: rgb(255 255 255 / 0.24);
  --glass-shadow: 0 12px 32px rgb(70 30 140 / 0.2), 0 2px 8px rgb(70 30 140 / 0.12);
  --sheet-fill: rgb(250 247 255 / 0.86);
  --sheet-fill-strong: rgb(255 255 255 / 0.92);
  --drop-hi: 0.55;
  --drop-tint: 0.22;
  --glass-blur: 22px;
  --glass-sat: 1.6;
  --drop-blur: 14px;
  --glow-work: 167 139 250;
  --glow-rest: 94 234 212;
  --glow-rgb: var(--glow-work);
}
@media (prefers-color-scheme: dark) {
  :root {
    --purple-ink: #c4b5fd;
    --danger-ink: #ff8a9b;
    --ink: #f6f1ff;
    --ink-soft: rgb(246 241 255 / 0.78);
    --lit-ink: var(--ink);
    --bg-base: #12091f;
    --glass-fill: rgb(255 255 255 / 0.1);
    --glass-fill-strong: rgb(255 255 255 / 0.18);
    --glass-rim: rgb(255 255 255 / 0.42);
    --glass-rim-dim: rgb(255 255 255 / 0.1);
    --glass-shadow: 0 14px 36px rgb(0 0 0 / 0.5), 0 2px 8px rgb(0 0 0 / 0.35);
    --sheet-fill: rgb(24 13 42 / 0.9);
    --sheet-fill-strong: rgb(40 24 66 / 0.92);
    --drop-hi: 0.2;
    --drop-tint: 0.08;
    --glow-work: 109 40 217;
    --glow-rest: 13 116 108;
  }
}
html[data-quality=low] {
  --glass-blur: 8px;
  --glass-sat: 1.15;
  --drop-blur: 0px;
}
.surface {
  position: relative;
  background:
    linear-gradient(
      180deg,
      var(--glass-fill-strong),
      var(--glass-fill));
  -webkit-backdrop-filter: blur(var(--glass-blur)) saturate(var(--glass-sat));
  backdrop-filter: blur(var(--glass-blur)) saturate(var(--glass-sat));
  border-radius: 24px;
  box-shadow:
    var(--glass-shadow),
    inset 0 1.5px 0 var(--glass-rim),
    inset 0 -1px 0 var(--glass-rim-dim),
    inset 0 0 0 1px var(--glass-rim-dim);
}
html[data-refract] .surface {
  backdrop-filter: url(#glass-refract) blur(var(--glass-blur)) saturate(var(--glass-sat));
}
#zoomnav button,
#topbar button,
.set-btn {
  border: 0;
  font: inherit;
  color: var(--ink);
  cursor: pointer;
  background:
    linear-gradient(
      180deg,
      var(--glass-fill-strong),
      var(--glass-fill));
  -webkit-backdrop-filter: blur(calc(var(--glass-blur) * 0.6)) saturate(var(--glass-sat));
  backdrop-filter: blur(calc(var(--glass-blur) * 0.6)) saturate(var(--glass-sat));
  box-shadow:
    var(--glass-shadow),
    inset 0 1.5px 0 var(--glass-rim),
    inset 0 0 0 1px var(--glass-rim-dim);
  transition: transform 0.18s cubic-bezier(0.2, 0.8, 0.2, 1);
  -webkit-tap-highlight-color: transparent;
}
#zoomnav button:active,
#topbar button:active,
.set-btn:active {
  transform: scale(0.94);
}
.bg {
  position: fixed;
  inset: 0;
  z-index: 0;
  overflow: hidden;
  background: var(--bg-base);
  pointer-events: none;
}
.bg__blob {
  position: absolute;
  width: 85vmax;
  height: 85vmax;
  border-radius: 50%;
  will-change: transform;
  opacity: 0.85;
  background:
    radial-gradient(
      closest-side,
      var(--c) 0%,
      transparent 100%);
  animation: bg-drift 52s ease-in-out infinite alternate;
}
.bg__blob:nth-child(1) {
  --c: var(--bg-1);
  left: -35vmax;
  top: -30vmax;
  animation-duration: 23s;
}
.bg__blob:nth-child(2) {
  --c: var(--bg-2);
  right: -40vmax;
  top: -15vmax;
  animation-duration: 19s;
  animation-direction: alternate-reverse;
}
.bg__blob:nth-child(3) {
  --c: var(--bg-3);
  left: -30vmax;
  bottom: -40vmax;
  animation-duration: 27s;
}
.bg__blob:nth-child(4) {
  --c: var(--bg-4);
  right: -35vmax;
  bottom: -35vmax;
  animation-duration: 21s;
  animation-direction: alternate-reverse;
}
@keyframes bg-drift {
  from {
    transform: translate3d(-8vmax, -6vmax, 0) scale(1);
  }
  to {
    transform: translate3d(10vmax, 8vmax, 0) scale(1.18);
  }
}
.glass-stage {
  position: fixed;
  inset: 0;
  z-index: 0;
  display: block;
  width: 100%;
  height: 100%;
  pointer-events: none;
}
html[data-renderer=gl] .bg {
  display: none;
}
@media (forced-colors: active) {
  .glass-stage {
    display: none;
  }
  html[data-renderer=gl] .bg {
    display: block;
  }
}
@media (prefers-reduced-motion: reduce) {
  .bg__blob,
  .drop__glow {
    animation: none !important;
  }
  .drop,
  #zoomnav button,
  #topbar button,
  .set-btn {
    transition: none !important;
  }
}
html[data-freeze] *,
html[data-freeze] *::before,
html[data-freeze] *::after {
  animation-play-state: paused !important;
  transition: none !important;
}
html[data-renderer=gl] [data-pane] {
  background: none;
  -webkit-backdrop-filter: none;
  backdrop-filter: none;
  box-shadow: var(--glass-shadow);
}
html[data-renderer=gl] #topbar button[data-pane],
html[data-renderer=gl] #zoomnav button[data-pane],
html[data-renderer=gl] #toptitle[data-pane] {
  background: none;
  -webkit-backdrop-filter: none;
  backdrop-filter: none;
  box-shadow: 0 8px 20px rgb(70 30 140 / 0.18), 0 1px 4px rgb(70 30 140 / 0.12);
}
html[data-renderer=gl] .game__field::before {
  display: none;
}
html[data-renderer=gl][data-glyphs] .day-cell__num,
html[data-renderer=gl][data-glyphs] .m-cell__num {
  color: transparent;
}

/* src/drops/drops.css */
.drop {
  position: relative;
  display: grid;
  grid-template-columns: minmax(0, 1fr);
  grid-template-areas: "lens" "wd" "dots";
  justify-items: center;
  align-content: center;
  row-gap: 6px;
  padding: 0;
  border: 0;
  background: none;
  font: inherit;
  color: var(--ink);
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
}
.drop__lens {
  grid-area: lens;
  position: relative;
  display: block;
  width: min(var(--lens, 44px), 100%);
  aspect-ratio: 1;
  pointer-events: none;
}
.m-cell.drop {
  --lens: 36px;
  row-gap: 2px;
}
.day-cell__num,
.m-cell__num {
  grid-area: lens;
  place-self: center;
  z-index: 1;
  pointer-events: none;
  transform: translateY(var(--lift, 0px)) rotate(var(--phi, 0deg)) scale(var(--sx, 1), var(--sy, 1)) rotate(calc(-1 * var(--phi, 0deg)));
}
.day-cell__wd {
  grid-area: wd;
}
.day-cell__dots,
.m-cell__dots {
  grid-area: dots;
}
.drop__shadow,
.drop__glass {
  position: absolute;
  inset: 0;
  border-radius: 50%;
  pointer-events: none;
  transform: translateY(var(--lift, 0px)) rotate(var(--phi, 0deg)) scale(var(--sx, 1), var(--sy, 1)) rotate(calc(-1 * var(--phi, 0deg)));
}
.drop__shadow {
  transform: rotate(var(--la)) translateX(var(--so)) rotate(calc(-1 * var(--la))) rotate(var(--phi, 0deg)) scale(var(--sx, 1), var(--sy, 1)) rotate(calc(-1 * var(--phi, 0deg)));
}
.drop__shadow::before {
  content: "";
  position: absolute;
  inset: -14%;
  border-radius: 50%;
  background:
    radial-gradient(
      circle closest-side,
      rgb(255 248 236 / 0.55) 0%,
      rgb(255 248 236 / 0.18) 38%,
      rgb(48 18 92 / 0) 52%,
      rgb(48 18 92 / 0.26) 74%,
      rgb(48 18 92 / 0.10) 88%,
      rgb(48 18 92 / 0) 100%);
}
.drop__shadow::after {
  content: "";
  position: absolute;
  inset: -45%;
  border-radius: 50%;
  opacity: var(--g, 0);
  background:
    radial-gradient(
      circle closest-side,
      rgb(var(--gc) / 0.55) 40%,
      rgb(var(--gc) / 0.16) 62%,
      rgb(var(--gc) / 0) 100%);
}
.drop__glass {
  overflow: hidden;
  border-radius: var(--br, 50%);
  isolation: isolate;
  box-shadow: 0 0 0 0.5px rgb(40 14 84 / 0.30), 0 0.5px 1.5px rgb(40 14 84 / 0.28);
}
.drop__glass i {
  position: absolute;
  inset: 0;
  border-radius: 50%;
}
.drop__rot {
  transform: rotate(var(--la));
}
.drop__body {
  background:
    radial-gradient(
      circle closest-side,
      rgb(96 60 170 / 0.16),
      rgb(96 60 170 / 0.07) 70%,
      rgb(200 180 255 / 0.06));
}
.drop__band {
  background:
    radial-gradient(
      circle closest-side,
      transparent 58%,
      rgb(36 12 78 / 0.34) 84%,
      rgb(36 12 78 / 0.18) 94%,
      transparent 99%);
  -webkit-mask:
    linear-gradient(
      90deg,
      #000,
      rgb(0 0 0 / 0.45) 55%,
      rgb(0 0 0 / 0.2));
  mask:
    linear-gradient(
      90deg,
      #000,
      rgb(0 0 0 / 0.45) 55%,
      rgb(0 0 0 / 0.2));
}
.drop__caustic {
  mix-blend-mode: screen;
  transform: translateX(calc((1 - var(--k, 1)) * 34%)) scale(calc(1 + (1 - var(--k, 1)) * 0.3));
  background:
    radial-gradient(
      circle closest-side,
      transparent 38%,
      rgb(255 246 232 / 0.62) 63%,
      rgb(255 246 232 / 0) 86%);
  -webkit-mask:
    linear-gradient(
      90deg,
      transparent 48%,
      #000 90%);
  mask:
    linear-gradient(
      90deg,
      transparent 48%,
      #000 90%);
}
.drop__glow {
  opacity: var(--g, 0);
  background:
    radial-gradient(
      circle closest-side at 52% 50%,
      rgb(255 255 255 / 0.4),
      rgb(var(--gc) / 0.22) 38%,
      rgb(var(--gc) / 0.7) 74%,
      rgb(var(--gc) / 0.25) 92%,
      rgb(var(--gc) / 0) 100%);
}
.drop__glass .drop__spec {
  inset: auto;
  width: 20%;
  height: 15%;
  left: calc(50% - (var(--ld) + 0.1) * 50% - 10%);
  top: 42.5%;
  border-radius: 34% 34% 30% 30%;
  opacity: var(--sp, 1);
  transform: rotate(calc(-1 * var(--la)));
  background:
    linear-gradient(
      90deg,
      transparent 45%,
      rgb(225 215 250 / 0.75) 45% 55%,
      transparent 55%),
    linear-gradient(
      transparent 44%,
      rgb(225 215 250 / 0.75) 44% 56%,
      transparent 56%),
    rgb(255 255 255 / 0.97);
  box-shadow: 0 0 5px 2px rgb(255 255 255 / 0.4);
}
.drop__glass .drop__spec2 {
  inset: auto;
  width: 16%;
  height: 16%;
  left: 76%;
  top: 42%;
  opacity: calc(var(--sp, 1) * 0.6);
  background:
    radial-gradient(
      closest-side,
      #fff,
      rgb(255 255 255 / 0));
}
.drop__rim {
  -webkit-mask:
    radial-gradient(
      circle closest-side,
      transparent calc(100% - 1.8px),
      #000 calc(100% - 0.6px));
  mask:
    radial-gradient(
      circle closest-side,
      transparent calc(100% - 1.8px),
      #000 calc(100% - 0.6px));
  background:
    conic-gradient(
      rgb(255 255 255 / 0.3),
      rgb(255 255 255 / 0.85) 90deg,
      rgb(255 255 255 / 0.3) 180deg,
      rgb(255 255 255 / 0.95) 270deg,
      rgb(255 255 255 / 0.3));
}
@media (prefers-color-scheme: dark) {
  .drop__shadow::before {
    background:
      radial-gradient(
        circle closest-side,
        rgb(255 248 236 / 0.32) 0%,
        rgb(255 248 236 / 0.10) 38%,
        rgb(0 0 0 / 0) 52%,
        rgb(0 0 0 / 0.40) 74%,
        rgb(0 0 0 / 0.14) 88%,
        rgb(0 0 0 / 0) 100%);
  }
  .drop__glass {
    box-shadow: 0 0 0 0.5px rgb(0 0 0 / 0.55), 0 0.5px 1.5px rgb(0 0 0 / 0.5);
  }
  .drop__band {
    background:
      radial-gradient(
        circle closest-side,
        transparent 58%,
        rgb(0 0 0 / 0.5) 84%,
        rgb(0 0 0 / 0.3) 94%,
        transparent 99%);
  }
  .drop__glow {
    mix-blend-mode: screen;
    background:
      radial-gradient(
        circle closest-side at 52% 50%,
        rgb(var(--gc) / 0.95),
        rgb(var(--gc) / 0.6) 45%,
        rgb(var(--gc) / 0.18) 80%,
        rgb(var(--gc) / 0) 100%);
  }
}
.traveler {
  position: fixed;
  left: 0;
  top: 0;
  width: 18px;
  height: 18px;
  border-radius: 50%;
  pointer-events: none;
  z-index: 5;
  background:
    radial-gradient(
      circle,
      rgb(var(--glow-rgb) / 0.95),
      rgb(var(--glow-rgb) / 0) 70%);
}
.traveler[data-kind=rest] {
  --glow-rgb: var(--glow-rest);
}
.traveler[data-kind=work] {
  --glow-rgb: var(--glow-work);
}

/* src/weather/scene.css */
.sky {
  --sky-bg:
    linear-gradient(
      180deg,
      #4f9be6,
      #a6d2fa);
  --cloud: #fff;
  --cloud-o: 0.94;
  --streak: rgb(255 255 255 / 0.85);
  position: relative;
  height: 100%;
  min-height: 52px;
  border-radius: 18px;
  overflow: hidden;
  background: var(--sky-bg);
  box-shadow:
    inset 0 1px 0 rgb(255 255 255 / 0.55),
    inset 0 0 0 1px rgb(255 255 255 / 0.2),
    inset 0 -10px 18px rgb(255 255 255 / 0.12);
}
.sky[data-sky=grey] {
  --sky-bg:
    linear-gradient(
      180deg,
      #7f8da3,
      #bfc9d6);
  --cloud: #eef2f8;
  --cloud-o: 0.92;
}
.sky[data-sky=storm] {
  --sky-bg:
    linear-gradient(
      180deg,
      #3d4259,
      #6f7590);
  --cloud: #767a92;
  --cloud-o: 0.96;
}
.sky[data-sky=ice] {
  --sky-bg:
    linear-gradient(
      180deg,
      #7fa6c2,
      #d3e7f3);
  --cloud: #e8f2fa;
  --cloud-o: 0.92;
  --streak: rgb(214 240 255 / 0.95);
}
.sky[data-time=night] {
  --sky-bg:
    linear-gradient(
      180deg,
      #17113d,
      #382a72);
  --cloud: #968cc8;
  --cloud-o: 0.55;
}
.sky[data-time=night][data-sky=grey] {
  --sky-bg:
    linear-gradient(
      180deg,
      #252338,
      #46435f);
  --cloud: #787496;
  --cloud-o: 0.75;
}
.sky[data-time=night][data-sky=storm] {
  --sky-bg:
    linear-gradient(
      180deg,
      #121124,
      #2f2d47);
  --cloud: #464462;
  --cloud-o: 0.95;
}
.sky[data-time=night][data-sky=ice] {
  --sky-bg:
    linear-gradient(
      180deg,
      #1a2a40,
      #39526d);
  --cloud: #788caa;
  --cloud-o: 0.7;
}
.sky [hidden] {
  display: none;
}
.sky > i {
  position: absolute;
  display: block;
}
.sky__sun,
.sky__moon {
  z-index: 1;
  width: 26px;
  height: 26px;
  border-radius: 50%;
  opacity: var(--body-o, 1);
  left: calc(10% + var(--x, 0.5) * 80%);
  top: calc(84% - var(--y, 0.5) * 64%);
  transform: translate(-50%, -50%);
}
.sky__sun {
  background:
    radial-gradient(
      circle at 40% 38%,
      #fffbe3,
      #ffd76e 55%,
      #ffb43a);
  box-shadow: 0 0 14px 4px rgb(255 214 107 / 0.55);
}
.sky__sun::before {
  content: "";
  position: absolute;
  inset: -16px;
  border-radius: 50%;
  background:
    radial-gradient(
      closest-side,
      rgb(255 238 176 / 0.6),
      transparent);
  animation: sky-halo 7s ease-in-out infinite alternate;
}
.sky__moon {
  width: 22px;
  height: 22px;
  overflow: hidden;
  background:
    radial-gradient(
      circle at 38% 35%,
      #fffdf2,
      #ebe5cf 70%,
      #cdc6ad);
  box-shadow: 0 0 12px 2px rgb(240 236 214 / 0.35);
}
.sky__shade {
  position: absolute;
  inset: 0;
  border-radius: 50%;
  background: rgb(20 15 50 / 0.9);
  transform: translateX(calc(var(--shift, 0) * 100%));
}
.sky__stars {
  inset: 0;
  animation: sky-twinkle 5s ease-in-out infinite alternate;
  background-image:
    radial-gradient(
      1.3px 1.3px at 12% 22%,
      #fff 98%,
      transparent),
    radial-gradient(
      1px 1px at 31% 10%,
      #fff 98%,
      transparent),
    radial-gradient(
      1.4px 1.4px at 57% 30%,
      #fff 98%,
      transparent),
    radial-gradient(
      1px 1px at 74% 14%,
      #fff 98%,
      transparent),
    radial-gradient(
      1.2px 1.2px at 88% 42%,
      #fff 98%,
      transparent),
    radial-gradient(
      1px 1px at 21% 50%,
      #fff 98%,
      transparent);
}
.sky__cloud {
  z-index: 2;
  left: var(--cx);
  top: calc(var(--cy) + 14px);
  width: 56px;
  height: 18px;
  margin-left: -28px;
  border-radius: 10px;
  background: var(--cloud);
  opacity: var(--cloud-o);
  transform: scale(var(--cs, 1));
  animation: sky-cloud var(--dur, 50s) linear var(--delay, 0s) infinite;
}
.sky__cloud::before,
.sky__cloud::after {
  content: "";
  position: absolute;
  border-radius: 50%;
  background: inherit;
}
.sky__cloud::before {
  left: 9px;
  bottom: 7px;
  width: 24px;
  height: 24px;
}
.sky__cloud::after {
  left: 27px;
  bottom: 5px;
  width: 18px;
  height: 18px;
}
.sky__fog {
  z-index: 3;
  left: -30%;
  right: -30%;
  top: var(--cy);
  height: 15px;
  border-radius: 8px;
  background:
    linear-gradient(
      90deg,
      transparent,
      rgb(255 255 255 / 0.72) 30%,
      rgb(255 255 255 / 0.55) 70%,
      transparent);
  animation: sky-fog var(--dur, 22s) ease-in-out var(--delay, 0s) infinite alternate;
}
.sky__rain {
  z-index: 3;
  left: var(--px);
  top: var(--py);
  width: 1.5px;
  height: 13px;
  border-radius: 1px;
  background: linear-gradient(transparent, var(--streak));
  animation: sky-fall var(--dur, 0.7s) linear var(--delay, 0s) infinite;
  transform: rotate(12deg);
}
.sky[data-kind=drizzle] .sky__rain {
  height: 7px;
  opacity: 0.7;
}
.sky[data-kind=heavy] .sky__rain {
  width: 2px;
  height: 19px;
}
.sky__drop {
  z-index: 4;
  left: var(--px);
  top: var(--py);
  width: 5px;
  height: 7px;
  border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
  background:
    radial-gradient(
      circle at 35% 30%,
      rgb(255 255 255 / 0.95) 0 18%,
      rgb(255 255 255 / 0.28) 42%,
      rgb(255 255 255 / 0.1) 72%);
  box-shadow: 0 1px 1px rgb(0 0 0 / 0.2), inset 0 -1px 1px rgb(255 255 255 / 0.5);
  animation: sky-slide var(--dur, 9s) cubic-bezier(0.5, 0, 0.9, 0.6) var(--delay, 0s) infinite;
}
.sky__flake {
  z-index: 3;
  left: var(--px);
  top: var(--py);
  width: var(--size, 7px);
  height: var(--size, 7px);
  border-radius: 50%;
  background:
    radial-gradient(
      circle,
      #fff 0 42%,
      rgb(255 255 255 / 0.45) 66%,
      transparent 72%);
  animation: sky-snow var(--dur, 9s) linear var(--delay, 0s) infinite;
}
.sky__hail {
  z-index: 3;
  left: var(--px);
  top: var(--py);
  width: 4px;
  height: 4px;
  border-radius: 50%;
  background:
    radial-gradient(
      circle at 35% 35%,
      #fff,
      #d8e6f0);
  animation: sky-hail var(--dur, 1.1s) cubic-bezier(0.5, 0, 1, 1) var(--delay, 0s) infinite;
}
.sky__flash {
  z-index: 5;
  inset: 0;
  background: rgb(236 230 255 / 0.85);
  opacity: 0;
  animation: sky-flash 7.3s linear infinite;
}
.sky__bolt {
  z-index: 5;
  left: 58%;
  top: 8%;
  width: 18px;
  height: 46px;
  opacity: 0;
  animation: sky-flash 7.3s linear infinite;
}
.sky__bolt svg {
  width: 100%;
  height: 100%;
  fill: #fff4c4;
}
@keyframes sky-halo {
  from {
    transform: scale(0.9);
    opacity: 0.6;
  }
  to {
    transform: scale(1.15);
    opacity: 1;
  }
}
@keyframes sky-twinkle {
  from {
    opacity: 0.55;
  }
  to {
    opacity: 1;
  }
}
@keyframes sky-cloud {
  0% {
    transform: translateX(-36px) scale(var(--cs, 1));
    opacity: 0;
  }
  15%, 85% {
    opacity: var(--cloud-o, 1);
  }
  100% {
    transform: translateX(36px) scale(var(--cs, 1));
    opacity: 0;
  }
}
@keyframes sky-fog {
  from {
    transform: translateX(-12%);
  }
  to {
    transform: translateX(12%);
  }
}
@keyframes sky-fall {
  from {
    transform: translate(14px, -110px) rotate(12deg);
  }
  to {
    transform: translate(-4px, 50px) rotate(12deg);
  }
}
@keyframes sky-slide {
  0% {
    transform: translateY(-40px);
    opacity: 0;
  }
  10% {
    opacity: 1;
  }
  55% {
    transform: translateY(-30px);
  }
  100% {
    transform: translateY(60px);
    opacity: 0.9;
  }
}
@keyframes sky-snow {
  0% {
    transform: translate(0, -100px);
  }
  25% {
    transform: translate(6px, -65px);
  }
  50% {
    transform: translate(-4px, -30px);
  }
  75% {
    transform: translate(5px, 5px);
  }
  100% {
    transform: translate(0, 40px);
  }
}
@keyframes sky-hail {
  from {
    transform: translateY(-110px);
  }
  to {
    transform: translateY(50px);
  }
}
@keyframes sky-flash {
  0%, 89%, 91.5%, 93%, 100% {
    opacity: 0;
  }
  90% {
    opacity: 0.85;
  }
  92% {
    opacity: 0.5;
  }
}
html[data-quality=low] .sky__p--extra {
  display: none;
}
@media (prefers-reduced-motion: reduce) {
  .sky *,
  .sky *::before {
    animation: none !important;
  }
  .sky__rain {
    transform: rotate(12deg);
  }
}
.sky__gl {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  display: block;
}

/* src/cards/top.css */
:root {
  --tc-top: calc(var(--top-edge) + 96px);
  --tc-h: clamp(104px, 15vh, 140px);
  --tc-below: calc(var(--tc-top) + var(--tc-h) + 8px);
}
.topcard {
  position: fixed;
  z-index: 1;
  top: var(--tc-top);
  inset-inline: max(12px, var(--safe-side));
  max-width: 600px;
  margin-inline: auto;
  height: var(--tc-h);
  border-radius: 30px;
  overflow: hidden;
  color: #fff;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
  isolation: isolate;
  box-shadow: 0 16px 36px rgb(40 20 110 / 0.28), 0 2px 8px rgb(40 20 110 / 0.18);
  transition: height 0.55s cubic-bezier(0.34, 1.35, 0.5, 1), box-shadow 0.4s ease;
}
.topcard[hidden],
.wbadge[hidden],
.topcard [hidden] {
  display: none;
}
.topcard[data-open] {
  z-index: 3;
  height: calc(var(--tc-h) + var(--tc-hours));
  box-shadow: 0 24px 54px rgb(40 20 110 / 0.36), 0 3px 10px rgb(40 20 110 / 0.2);
}
.topcard__sky {
  position: absolute;
  inset: 0;
  z-index: 0;
}
.topcard__sky .sky {
  border-radius: 0;
  box-shadow: none;
  min-height: 0;
}
.topcard__scrim {
  position: absolute;
  inset: 0;
  z-index: 1;
  pointer-events: none;
  background:
    linear-gradient(
      180deg,
      rgb(10 20 60 / 0.50),
      rgb(10 20 60 / 0.16) 38%,
      rgb(10 20 60 / 0.22) 62%,
      rgb(10 20 60 / 0.52));
}
.topcard::after {
  content: "";
  position: absolute;
  inset: 0;
  z-index: 2;
  border-radius: inherit;
  pointer-events: none;
  background:
    linear-gradient(
      115deg,
      transparent 30%,
      rgb(255 255 255 / 0.16) 46%,
      rgb(255 255 255 / 0.04) 54%,
      transparent 70%) no-repeat,
    radial-gradient(
      26% 12px at var(--glint-x, 50%) 0,
      rgb(255 246 214 / 0),
      transparent);
  background-size: 260% 100%, auto;
  background-position: 140% 0, 0 0;
  animation: tc-sweep 9s ease-in-out infinite;
}
.topcard[data-glint]::after {
  background-image:
    linear-gradient(
      115deg,
      transparent 30%,
      rgb(255 255 255 / 0.16) 46%,
      rgb(255 255 255 / 0.04) 54%,
      transparent 70%),
    radial-gradient(
      26% 12px at var(--glint-x, 50%) 0,
      rgb(255 246 214 / 0.95),
      transparent);
}
@keyframes tc-sweep {
  0%, 55% {
    background-position: 140% 0, 0 0;
  }
  100% {
    background-position: -40% 0, 0 0;
  }
}
html[data-freeze] .topcard::after {
  animation: none;
}
.topcard__main {
  position: relative;
  z-index: 3;
  height: var(--tc-h);
  box-sizing: border-box;
  padding: 11px 18px 10px;
  display: grid;
  grid-template-rows: auto minmax(0, 1fr) auto;
  align-content: stretch;
  text-shadow: 0 1px 10px rgb(10 20 60 / 0.35);
}
.topcard__head {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 12px;
  font-size: 13px;
  font-weight: 700;
}
.topcard__when {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  min-width: 0;
}
.topcard__date {
  font-weight: 400;
  opacity: 0.92;
}
.topcard__clock {
  font-size: 15px;
  font-weight: 700;
  letter-spacing: 0.4px;
  font-variant-numeric: tabular-nums;
}
.topcard__temp {
  align-self: center;
  justify-self: start;
  font-size: clamp(40px, 6.6vh, 58px);
  font-weight: 200;
  line-height: 1.05;
  letter-spacing: -1px;
  font-variant-numeric: tabular-nums;
}
.topcard__line {
  display: flex;
  align-items: baseline;
  gap: 10px;
  font-size: 14px;
  font-weight: 700;
  min-width: 0;
}
.topcard__cond {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.topcard__hilo {
  font-weight: 400;
  font-size: 13px;
  opacity: 0.95;
  white-space: nowrap;
}
.topcard__updated {
  font-size: 11px;
  font-weight: 400;
  opacity: 0.9;
  margin-inline-start: auto;
  white-space: nowrap;
}
.topcard__setup {
  position: absolute;
  inset-inline-end: 14px;
  inset-block-end: 10px;
  min-height: 40px;
  padding: 0 14px;
  border: 0;
  border-radius: 16px;
  font: inherit;
  font-size: 13px;
  font-weight: 700;
  color: #fff;
  background: rgb(255 255 255 / 0.22);
  box-shadow: inset 0 1px 0 rgb(255 255 255 / 0.5), 0 2px 8px rgb(10 20 60 / 0.25);
  cursor: pointer;
  text-shadow: none;
}
.topcard__more {
  position: absolute;
  inset-inline-end: 12px;
  inset-block-start: 38px;
  width: 44px;
  height: 44px;
  margin: 0;
  padding: 0;
  border: 0;
  border-radius: 50%;
  display: grid;
  place-items: center;
  background: none;
  color: #fff;
  cursor: pointer;
  opacity: 0.85;
  transition: transform 0.45s cubic-bezier(0.34, 1.35, 0.5, 1);
}
.topcard__more svg {
  width: 22px;
  height: 22px;
  fill: none;
  stroke: currentColor;
  stroke-width: 2.2;
  stroke-linecap: round;
  stroke-linejoin: round;
  filter: drop-shadow(0 1px 4px rgb(10 20 60 / 0.4));
}
.topcard[data-open] .topcard__more {
  transform: rotate(180deg);
}
.topcard:not([data-ready]) .topcard__more {
  display: none;
}
:root {
  --tc-hours: 98px;
}
.topcard[data-stats] {
  --tc-hours: 144px;
}
.topcard__hours {
  position: absolute;
  inset-inline: 10px;
  inset-block-start: var(--tc-h);
  z-index: 3;
  height: calc(var(--tc-hours) - 12px);
  display: grid;
  grid-template-rows: minmax(0, 1fr) auto;
  gap: 8px;
  opacity: 0;
  transform: translateY(10px);
  transition: opacity 0.3s ease, transform 0.5s cubic-bezier(0.34, 1.35, 0.5, 1);
  pointer-events: none;
  text-shadow: none;
}
.topcard[data-open] .topcard__hours {
  opacity: 1;
  transform: none;
  pointer-events: auto;
  transition-delay: 0.08s;
}
.topcard__chips {
  display: grid;
  grid-template-columns: repeat(6, minmax(0, 1fr));
  gap: 6px;
  min-height: 0;
}
.hc {
  display: grid;
  grid-template-rows: auto 1fr auto auto;
  justify-items: center;
  align-items: center;
  gap: 1px;
  padding: 6px 2px 5px;
  border-radius: 18px;
  font-size: 13px;
  font-weight: 700;
  background: rgb(255 255 255 / 0.17);
  box-shadow:
    inset 0 1px 0 rgb(255 255 255 / 0.5),
    inset 0 0 0 1px rgb(255 255 255 / 0.14),
    0 2px 8px rgb(10 20 60 / 0.16);
  -webkit-backdrop-filter: blur(10px);
  backdrop-filter: blur(10px);
}
.hc:first-child {
  background: rgb(255 255 255 / 0.3);
}
.hc__t {
  font-size: 11px;
  font-weight: 400;
  opacity: 0.95;
}
.hc__p {
  min-height: 12px;
  font-size: 10px;
  font-weight: 700;
  color: #bfe3ff;
  line-height: 12px;
}
.hc svg {
  width: 24px;
  height: 24px;
  fill: none;
  stroke: currentColor;
  stroke-width: 1.8;
  stroke-linecap: round;
  stroke-linejoin: round;
}
.topcard__stats {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 6px;
}
.topcard__stats:empty {
  display: none;
}
.sc {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 6px;
  padding: 8px 12px;
  border-radius: 16px;
  font-size: 13px;
  font-weight: 700;
  background: rgb(255 255 255 / 0.13);
  box-shadow: inset 0 1px 0 rgb(255 255 255 / 0.4), inset 0 0 0 1px rgb(255 255 255 / 0.1);
  -webkit-backdrop-filter: blur(10px);
  backdrop-filter: blur(10px);
}
.sc__l {
  font-weight: 400;
  font-size: 12px;
  opacity: 0.95;
}
.sc__v {
  white-space: nowrap;
  font-variant-numeric: tabular-nums;
}
.topcard[data-loading] .topcard__temp:empty::before {
  content: "";
  display: block;
  width: 110px;
  height: 0.8em;
  border-radius: 14px;
  background:
    linear-gradient(
      100deg,
      rgb(255 255 255 / 0.14) 30%,
      rgb(255 255 255 / 0.34) 50%,
      rgb(255 255 255 / 0.14) 70%) 0 0 / 220% 100%;
  animation: tc-shimmer 1.4s linear infinite;
}
@keyframes tc-shimmer {
  from {
    background-position: 120% 0;
  }
  to {
    background-position: -120% 0;
  }
}
html[data-freeze] .topcard[data-loading] .topcard__temp:empty::before {
  animation: none;
}
@media (prefers-reduced-motion: reduce) {
  .topcard,
  .topcard__hours,
  .topcard__more {
    transition: none;
  }
  .topcard::after,
  .topcard[data-loading] .topcard__temp:empty::before {
    animation: none;
  }
}
.wbadge {
  position: fixed;
  z-index: 1;
  top: calc(var(--top-edge) + 52px);
  height: 40px;
  min-width: 64px;
  padding: 0 12px;
  border-radius: 20px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  font: inherit;
  font-size: 14px;
  font-weight: 700;
  color: var(--ink);
}
button.wbadge {
  border: 0;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}
.wbadge--clock {
  inset-inline-start: max(12px, var(--safe-side));
}
.wbadge--weather {
  inset-inline-end: max(12px, var(--safe-side));
}
.wbadge__icon svg {
  display: block;
  width: 20px;
  height: 20px;
  fill: none;
  stroke: currentColor;
  stroke-width: 2;
  stroke-linecap: round;
  stroke-linejoin: round;
}

/* src/cards/cards.css */
.card {
  position: absolute;
  inset: 0;
  z-index: 1;
  display: flex;
  flex-direction: column;
  gap: 2px;
  padding: 10px 14px 0;
  background:
    linear-gradient(
      180deg,
      var(--sheet-fill-strong),
      var(--sheet-fill));
}
.card[hidden] {
  display: none;
}
.card {
  transform-origin: 50% 100%;
}
html[data-renderer=gl] .card {
  background:
    linear-gradient(
      180deg,
      rgb(255 255 255 / 0.46),
      rgb(255 255 255 / 0.34));
  opacity: var(--cardo, 1);
}
@media (prefers-color-scheme: dark) {
  html[data-renderer=gl] .card {
    background:
      linear-gradient(
        180deg,
        rgb(40 24 66 / 0.62),
        rgb(24 13 42 / 0.55));
  }
}
.card__copy > :nth-child(1) {
  --i: 0;
}
.card__copy > :nth-child(2) {
  --i: 1;
}
.card__copy > :nth-child(3) {
  --i: 2;
}
.card__copy > :nth-child(4) {
  --i: 3;
}
.card__copy > :nth-child(5) {
  --i: 4;
}
.card__copy > :nth-child(n+6) {
  --i: 5;
}
.card__line,
.card__empty {
  --k: clamp(0, calc((var(--x, 1) - var(--i, 0) * 0.07) * 2.4 - 0.3), 1);
  opacity: var(--k);
  transform: translateY(calc((1 - var(--k)) * 14px));
}
.card__head {
  opacity: clamp(0, calc(var(--x, 1) * 2.4 - 0.2), 1);
}
.card__head {
  display: flex;
  align-items: center;
  min-height: 36px;
  padding-inline-end: 48px;
}
.card__date {
  font-weight: 700;
  font-size: 15px;
  color: var(--purple-ink);
}
.card__view {
  flex: 1;
  min-height: 0;
  overflow: hidden;
  touch-action: none;
  -webkit-mask-image:
    linear-gradient(
      transparent,
      #000 8px,
      #000 calc(100% - 12px),
      transparent);
  mask-image:
    linear-gradient(
      transparent,
      #000 8px,
      #000 calc(100% - 12px),
      transparent);
}
.card__copy {
  list-style: none;
  margin: 0;
  padding: 0 0 12px;
  display: grid;
}
.card__copy[hidden] {
  display: none;
}
.card__line {
  display: flex;
  align-items: center;
  gap: 8px;
  min-height: 44px;
  font-size: 14px;
}
.card__line .dot {
  flex: none;
}
.card__time {
  font-size: 13px;
  font-weight: 700;
  color: var(--purple-ink);
  font-variant-numeric: tabular-nums;
}
.card__title {
  flex: 1;
  min-width: 0;
  overflow-wrap: anywhere;
}
.card__edit svg,
.card__delete svg {
  width: 20px;
  height: 20px;
  fill: none;
  stroke: currentColor;
  stroke-width: 2;
  stroke-linecap: round;
  stroke-linejoin: round;
}
.card__check {
  flex: none;
  position: relative;
  appearance: none;
  -webkit-appearance: none;
  width: 40px;
  height: 40px;
  margin: 0 -6px;
  border: 0;
  background: none;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}
.card__check::before {
  content: "";
  position: absolute;
  inset: 9px;
  box-sizing: border-box;
  border-radius: 8px;
  background: var(--glass-fill-strong);
  border: 1.5px solid var(--ink-soft);
  box-shadow: inset 0 1px 0 var(--glass-rim), 0 1px 3px rgb(70 30 140 / 0.25);
  transition: background-color 0.12s;
}
.card__check::after {
  content: "";
  position: absolute;
  left: 14px;
  top: 14px;
  width: 12px;
  height: 7px;
  border: solid #fff;
  border-width: 0 0 2.5px 2.5px;
  transform: rotate(-45deg) scale(0);
  transition: transform 0.12s;
}
.card__check:checked::before {
  background: var(--purple);
  border-color: var(--purple);
}
.card__check:checked::after {
  transform: rotate(-45deg) scale(1);
}
.card__check:focus-visible {
  outline: 2px solid var(--purple);
  outline-offset: -2px;
  border-radius: 10px;
}
@media (prefers-reduced-motion: reduce) {
  .card__check::before,
  .card__check::after {
    transition: none;
  }
}
.card__edit,
.card__delete,
.card__add {
  border: 0;
  background: transparent;
  font: inherit;
  color: var(--ink);
  cursor: pointer;
  display: inline-grid;
  place-items: center;
  min-width: 40px;
  min-height: 40px;
  padding: 0;
  -webkit-tap-highlight-color: transparent;
}
.card__edit,
.card__delete {
  opacity: 0.7;
}
.card__add {
  padding: 0 10px;
  font-weight: 700;
  color: var(--purple-ink);
}
.card__empty {
  display: flex;
  align-items: center;
  min-height: 40px;
  font-size: 13px;
  color: var(--ink-soft);
}
#bottom {
  position: fixed;
  inset-inline: max(12px, var(--safe-side));
  inset-block-end: calc(var(--bottom-edge) + 58px);
  z-index: 1;
  height: max(120px, min(236px, calc(50vh - 0.1215 * min(100vw, 640px) - var(--bottom-edge) - 100px)));
  max-width: 600px;
  margin-inline: auto;
  overflow: hidden;
  border-radius: 24px;
}
@supports (height: 1dvh) {
  #bottom {
    height: max(120px, min(236px, calc(50dvh - 0.1215 * min(100vw, 640px) - var(--bottom-edge) - 100px)));
  }
}
#bottom[data-view=year] {
  display: none;
}
#bottom[data-view=month] .game {
  visibility: hidden;
}
#bottom[data-view=month][data-state=IDLE] {
  pointer-events: none;
}

/* src/game/game.css */
.game {
  position: absolute;
  inset: 0;
  -webkit-tap-highlight-color: transparent;
}
.game__field {
  position: absolute;
  inset: 0;
  overflow: hidden;
  border-radius: 24px;
  touch-action: manipulation;
}
.game__field::before {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: inherit;
  background:
    linear-gradient(
      180deg,
      var(--glass-fill),
      rgb(255 255 255 / 0.04));
  -webkit-backdrop-filter: blur(var(--glass-blur)) saturate(var(--glass-sat));
  backdrop-filter: blur(var(--glass-blur)) saturate(var(--glass-sat));
  box-shadow: inset 0 1.5px 0 var(--glass-rim), inset 0 0 0 1px var(--glass-rim-dim);
}
.game__ground {
  position: absolute;
  inset-inline: 0;
  bottom: 0;
  height: var(--ground, 20px);
  border-radius: 14px 14px 24px 24px;
  background:
    linear-gradient(
      180deg,
      var(--glass-fill-strong),
      var(--glass-fill));
  -webkit-backdrop-filter: blur(var(--glass-blur)) saturate(var(--glass-sat));
  backdrop-filter: blur(var(--glass-blur)) saturate(var(--glass-sat));
  box-shadow: inset 0 1.5px 0 var(--glass-rim), inset 0 0 0 1px var(--glass-rim-dim);
}
.game__ob {
  position: absolute;
  left: 0;
  bottom: 0;
  border-radius: 10px 10px 6px 6px;
  will-change: transform;
  background:
    radial-gradient(
      120% 80% at 30% 15%,
      rgb(255 255 255 / var(--drop-hi)) 0%,
      rgb(255 255 255 / 0) 50%),
    linear-gradient(
      180deg,
      var(--glass-fill-strong),
      var(--glass-fill));
  -webkit-backdrop-filter: blur(var(--drop-blur)) saturate(var(--glass-sat));
  backdrop-filter: blur(var(--drop-blur)) saturate(var(--glass-sat));
  box-shadow:
    inset 0 1.5px 0 var(--glass-rim),
    inset 0 0 0 1px var(--glass-rim-dim),
    0 6px 14px rgb(60 20 120 / 0.22);
}
html[data-quality=low] .game__ob {
  backdrop-filter: none;
  -webkit-backdrop-filter: none;
}
.game__buddy {
  position: absolute;
  left: 0;
  bottom: 0;
  z-index: 2;
  pointer-events: none;
  transform-origin: 50% 100%;
  will-change: transform;
}
.game__buddy .buddy {
  position: absolute;
  inset: 0;
  overflow: visible;
}
.game__score,
.game__hint {
  position: absolute;
  padding: 4px 12px;
  border-radius: 14px;
  font-size: 13px;
  pointer-events: none;
  background:
    linear-gradient(
      180deg,
      var(--sheet-fill-strong),
      var(--sheet-fill));
  box-shadow: inset 0 1px 0 var(--glass-rim), 0 4px 12px rgb(60 20 120 / 0.14);
}
.game__score {
  top: 8px;
  inset-inline-start: 10px;
  display: flex;
  gap: 10px;
  font-weight: 700;
  font-variant-numeric: tabular-nums;
}
.game__best {
  color: var(--ink-soft);
  font-weight: 400;
}
.game__hint {
  top: 34%;
  inset-inline: 0;
  margin-inline: auto;
  width: fit-content;
  color: var(--ink);
}
.game__hint[hidden] {
  display: none;
}
.game__blob {
  position: absolute;
  inset: 0;
  z-index: 2;
  pointer-events: none;
}

/* src/buddy/buddy.css */
.buddy {
  --blink: 0;
  --lx: 0;
  --ly: 0;
  --eye: 1;
  --tilt: 0deg;
}
.buddy__body {
  position: absolute;
  inset: 0;
  transform-origin: 50% 100%;
  will-change: transform;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 22%;
  border-radius: 46% 46% 40% 40% / 52% 52% 44% 44%;
  rotate: var(--tilt);
  background:
    radial-gradient(
      80% 60% at 35% 22%,
      rgb(255 255 255 / 0.95) 0%,
      rgb(255 255 255 / 0) 60%),
    radial-gradient(
      70% 50% at 70% 85%,
      rgb(255 150 200 / 0.35),
      rgb(255 150 200 / 0) 70%),
    linear-gradient(
      180deg,
      #fff4fa,
      #ffd6ea);
  box-shadow:
    inset 0 -4px 8px rgb(255 120 180 / 0.25),
    inset 0 2px 3px rgb(255 255 255 / 0.9),
    0 6px 14px rgb(60 20 120 / 0.25);
}
.buddy__eye {
  position: relative;
  width: calc(14% * var(--eye));
  height: calc(24% * var(--eye));
  margin-bottom: 10%;
  border-radius: 50%;
  background:
    radial-gradient(
      circle at 38% 30%,
      #fff 0 20%,
      #2a1840 28%);
  transform: translate(calc(var(--lx) * 18%), calc(var(--ly) * 12%)) scaleY(calc(1 - var(--blink) * 0.92));
  transform-origin: 50% 60%;
}
.buddy[data-mood=party] .buddy__body::after {
  content: "";
  position: absolute;
  inset: -12% -8% auto;
  height: 30%;
  pointer-events: none;
  background:
    radial-gradient(
      circle at 15% 60%,
      #ffd84d 0 6%,
      transparent 7%),
    radial-gradient(
      circle at 45% 20%,
      #6be0ff 0 5%,
      transparent 6%),
    radial-gradient(
      circle at 80% 55%,
      #ff7ab8 0 6%,
      transparent 7%),
    radial-gradient(
      circle at 62% 85%,
      #a78bfa 0 5%,
      transparent 6%);
}
.buddy[data-mood=panic] .buddy__body::before {
  content: "";
  position: absolute;
  top: 6%;
  inset-inline-end: 8%;
  width: 14%;
  height: 22%;
  border-radius: 50% 50% 50% 50% / 62% 62% 38% 38%;
  background:
    radial-gradient(
      circle at 35% 30%,
      #fff 0 18%,
      rgb(150 210 255 / 0.7) 40%,
      rgb(110 170 255 / 0.5));
  box-shadow: inset 0 -1px 2px rgb(60 100 200 / 0.3);
}
@media (prefers-reduced-motion: reduce) {
  .buddy__body,
  .buddy__eye {
    transition: none;
  }
}
.buddy__gl {
  position: absolute;
  pointer-events: none;
}

  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
  --safe-side: max(env(safe-area-inset-left, 0px), env(safe-area-inset-right, 0px));
  --top-edge: max(12px, var(--safe-top));
  --bottom-edge: max(18px, var(--safe-bottom));

.day-cell {

.month-grid {

.m-cell {

.watermark {
  --top: calc(var(--top-edge) + 96px);
  --band: calc(50vh - var(--top) - 16px - 0.1215 * min(100vw, 640px));
  position: fixed;
  inset-inline: 0;
  top: var(--top);
  height: var(--band);
  z-index: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  padding-top: 0.14em;
  font-size: min(calc(var(--band) * 1.3), calc((100vw - 48px) / var(--len, 1) / 0.62), 320px);
  font-weight: 700;
  line-height: 1;
  pointer-events: none;
  user-select: none;
  color: transparent;
  -webkit-background-clip: text;
  background-clip: text;
  background-image:
    linear-gradient(
      160deg,
      rgb(30 12 64 / 0.62) 0%,
      rgb(30 12 64 / 0.36) 42%,
      rgb(30 12 64 / 0.5) 58%,
      rgb(30 12 64 / 0.3) 100%);
  -webkit-text-stroke: 1.5px rgb(255 255 255 / 0.8);
}

  visibility: hidden;
}
@media (prefers-color-scheme: dark) {

    background-image:
      linear-gradient(
        160deg,
        rgb(255 255 255 / 0.62) 0%,
        rgb(196 181 253 / 0.24) 42%,
        rgb(196 181 253 / 0.42) 58%,

}

}
html[data-topcard=week] .watermark {

}
html[data-topcard=week] .countdown-banner {

}

}
@supports (height: 1dvh) {
  .watermark {
    --band: calc(50dvh - var(--top) - 16px - 0.1215 * min(100vw, 640px));
  }
}
@media (forced-colors: active) {

.settings-sheet,
.item-form,

.settings-sheet {

  inset-block-start: calc(var(--top-edge) + 8px);
  inset-block-end: calc(var(--bottom-edge) + 64px);
  z-index: 3;
  padding: 0 12px 14px;
  display: flex;
  flex-direction: column;
  gap: 12px;
  overflow: auto;
  overscroll-behavior: contain;
  border-radius: 32px;
  animation: set-in 0.55s cubic-bezier(0.2, 1.15, 0.3, 1) both;
  transition: transform 0.35s cubic-bezier(0.2, 1.15, 0.3, 1);
  box-shadow:
    0 30px 70px rgb(40 20 110 / 0.35),
    0 4px 14px rgb(40 20 110 / 0.2),

}
@keyframes set-in {
  from {
    transform: translate3d(0, 56px, 0) scale(0.95);
    opacity: 0;
  }
  to {
    transform: none;
    opacity: 1;
  }
}
@keyframes set-out {
  to {
    transform: translate3d(0, 70px, 0) scale(0.97);
    opacity: 0;
  }
}
.set-scrim {
  position: fixed;
  inset: 0;

  background: rgb(24 10 60 / 0.30);
  -webkit-backdrop-filter: blur(5px);
  backdrop-filter: blur(5px);
  animation: scrim-in 0.35s ease both;
}
.set-scrim[data-closing] {
  animation: scrim-out 0.24s ease both;
}
@keyframes scrim-in {
  from {
    opacity: 0;
  }
}
@keyframes scrim-out {
  to {
    opacity: 0;
  }
}
@media (prefers-reduced-motion: reduce) {
  .settings-sheet,
  .settings-sheet[data-closing],
  .set-scrim,
  .set-scrim[data-closing] {

html[data-skin=clean] {
  --font:
    "Inter",
    "Vazirmatn",
    system-ui,
    sans-serif;
  --bg-base: #f5f4f8;
  --ink: #111;
  --ink-soft: #44444e;
  --purple-ink: #2b1f4a;
  --lit-ink: #111;
  --cl-card: #fff;
  --cl-line: rgb(17 17 17 / 0.07);
  --cl-lime: #d4f06b;
  --cl-lilac: #b9a4ff;
  --cl-deep: #2b1f4a;
  --cl-shadow: 0 8px 24px rgb(17 17 17 / 0.06);
  --cl-pad: 18px;
  --glass-fill: #fff;
  --glass-fill-strong: #fff;
  --glass-rim: transparent;
  --glass-rim-dim: rgb(17 17 17 / 0.08);
  --glass-shadow: 0 14px 40px rgb(17 17 17 / 0.14);
  --sheet-fill: #fff;
  --sheet-fill-strong: #fff;
  --glass-blur: 0px;
  --glass-sat: 1;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  html[data-skin=clean] {
    --bg-base: #0f0e14;
    --ink: #f4f3f8;
    --ink-soft: #d2d1de;
    --purple-ink: #cfc2ff;
    --lit-ink: #f4f3f8;
    --cl-card: #1b1a22;
    --cl-line: rgb(255 255 255 / 0.08);
    --cl-shadow: 0 8px 24px rgb(0 0 0 / 0.35);
    --glass-fill: #1b1a22;
    --glass-fill-strong: #22212b;
    --glass-rim-dim: rgb(255 255 255 / 0.1);
    --sheet-fill: #1b1a22;
    --sheet-fill-strong: #1b1a22;
    color-scheme: dark;
  }
}
html[data-skin=clean] body {
  background: var(--bg-base);
  color: var(--ink);
  font-family: var(--font);
}
html[data-skin=clean] .bg,
html[data-skin=clean] .glass-stage,
html[data-skin=clean] .watermark {
  display: none;
}
.cl {
  position: fixed;
  inset: 0;
  display: flex;
  flex-direction: column;
  font-family: var(--font);
}
.cl-head {
  flex: none;
  background: var(--bg-base);
  position: relative;
  z-index: 1;
  display: flex;
  align-items: center;
  gap: 10px;
  padding: calc(var(--top-edge, 0px) + 10px) var(--cl-pad) 6px;
  max-width: 640px;
  width: 100%;
  margin-inline: auto;
  box-sizing: border-box;
}
.cl-grow {
  flex: 1;
}
.cl-page {
  flex: 1;
  min-height: 0;
  overflow-y: auto;
  overscroll-behavior: contain;
  -webkit-overflow-scrolling: touch;
  scrollbar-width: none;
  padding: 4px var(--cl-pad) calc(var(--bottom-edge, 0px) + 112px);
  max-width: 640px;
  width: 100%;
  margin-inline: auto;
  box-sizing: border-box;
  display: grid;
  gap: 22px;
  align-content: start;
}
.cl-page::-webkit-scrollbar {
  display: none;
}
[hidden] {
  display: none !important;
}
.cl-round {
  flex: none;
  width: 40px;
  height: 40px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  padding: 0;
  cursor: pointer;
  color: var(--ink);
  background: var(--cl-card);
  border: 1px solid var(--cl-line);
  -webkit-tap-highlight-color: transparent;
  transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
}
.cl-round:active {
  transform: scale(0.9);
}
.cl-round--s {
  width: 34px;
  height: 34px;
}
.cl-round svg {
  width: 20px;
  height: 20px;
  fill: none;
  stroke: currentColor;
  stroke-width: 1.8;
  stroke-linecap: round;
  stroke-linejoin: round;
}
.cl-round--s svg {
  width: 17px;
  height: 17px;
}
.cl-avatar {
  flex: none;
  width: 40px;
  height: 40px;
  border-radius: 50%;
  border: 0;
  display: grid;
  place-items: center;
  font: 600 17px var(--font);
  color: var(--cl-deep);
  background: var(--cl-lilac);
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}
.cl-hello h1 {
  margin: 0;
  font-size: 26px;
  font-weight: 700;
  letter-spacing: -0.4px;
  line-height: 1.25;
}
.cl-hello p {
  margin: 4px 0 0;
  font-size: 14px;
  color: var(--ink-soft);
}
.cl-chips {
  display: flex;
  gap: 8px;
  min-height: 78px;
  padding-block: 14px 26px;
  margin-block: -14px -26px;
  overflow-x: auto;
  scrollbar-width: none;
  margin-inline: calc(var(--cl-pad) * -1);
  padding-inline: var(--cl-pad);
}
